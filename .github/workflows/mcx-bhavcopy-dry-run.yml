name: MCX Bhavcopy Safe Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and validate MCX data without uploading
        env:
          MCX_BHAVCOPY_CSV_URL: ${{ secrets.MCX_BHAVCOPY_CSV_URL }}
        run: |
          python - <<'PY'
          import csv
          import io
          import os
          import sys
          from collections import Counter
          from pathlib import Path

          sys.path.insert(0, str(Path("backend/scripts").resolve()))
          from import_mcx_bhavcopy import download_and_convert

          url = os.environ.get("MCX_BHAVCOPY_CSV_URL", "").strip()
          if not url:
              raise SystemExit("Missing repository secret: MCX_BHAVCOPY_CSV_URL")

          content, symbols, source_format = download_and_convert(url)
          rows = list(csv.DictReader(io.StringIO(content.decode("utf-8"))))
          if not rows:
              raise SystemExit("Validation failed: parsed zero data rows.")

          counts = Counter(row["symbol"] for row in rows)
          missing_dates = sum(not row["date"] for row in rows)
          missing_expiries = sum(not row["expiry_date"] for row in rows)
          missing_closes = sum(not row["close"] for row in rows)
          if missing_dates or missing_expiries or missing_closes:
              raise SystemExit(
                  f"Validation failed: missing date={missing_dates}, "
                  f"expiry={missing_expiries}, close={missing_closes}"
              )

          print("DRY RUN ONLY — no AURORA API call and no database upload.")
          print(f"Source format: {source_format}")
          print(f"Rows parsed: {len(rows)}")
          print(f"Symbols found: {', '.join(sorted(symbols))}")
          print(f"Rows by symbol: {dict(sorted(counts.items()))}")
          print(f"Date range: {min(row['date'] for row in rows)} to {max(row['date'] for row in rows)}")
          print("Required date, expiry, and close fields: valid")
          PY
